<!DOCTYPE html>
<html>
<head>
    <title>Flask CI/CD App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Enter Your Name</h1>

    <form method="POST">
        <input type="text" name="name" required />
        <button type="submit">Submit</button>
    </form>

    <h2>Stored Names:</h2>
    <ul>
        {% for name in names %}
            <li>{{ name[0] }}</li>
        {% endfor %}
    </ul>
</body>
</html>
